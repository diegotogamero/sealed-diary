[package]
name = "sealed-diary-app"
description = "Sealed Diary desktop and mobile application"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "sealed_diary_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sealed-diary-core = { path = "../../crates/sealed-diary-core" }
sealed-diary-sync = { path = "../../crates/sealed-diary-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1"
